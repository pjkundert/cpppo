name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test-artifacts.yml
    with:
      release_tag: ${{ github.ref_name }}
  pypi-publish:
    name: Upload release to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cpppo
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: cpppo-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
