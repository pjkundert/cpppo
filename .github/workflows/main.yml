name: Python package

on:
  push:
    branches:
      - master
      - 'feature-**'
      - 'feature/**'
      - 'fix-**'
      - 'fix/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [py27, py311, py312, py313, py314]
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31.11.5
      - name: Lint with flake8
        if: matrix.target == 'py313'
        continue-on-error: true
        run: make TARGET=py313 nix-analyze
      - name: Test with pytest
        env:
          TARGET: ${{ matrix.target }}
        run: make nix-test
